# Sunucuda tek komutla çalıştırmak için: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maarif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
      POSTGRES_DB: maarif
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maarif:${POSTGRES_PASSWORD}@db:5432/maarif
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  db-data:
  uploads:
